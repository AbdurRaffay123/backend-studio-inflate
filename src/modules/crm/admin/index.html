<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inflate Studio CRM</title>
<style>
  :root {
    --brand:      #2f6b62;
    --brand-soft: #afccc6;
    --brand-bg:   #eef5f3;
    --gold:       #c79a3d;
    --ink:        #1d2530;
    --muted:      #5a6573;
    --line:       #d8e2df;
    --bg:         #f7faf9;
    --white:      #ffffff;
    --shadow:     0 18px 45px rgba(29,37,48,.08);
    --shadow-sm:  0 8px 22px rgba(29,37,48,.06);
    --sidebar-w:  240px;

    --status-new:       #2b6cb0;
    --status-contacted: #c98a1f;
    --status-booked:    #2f6b62;
    --status-completed: #1f6f48;
    --status-cancelled: #718096;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    background:
      radial-gradient(circle at top left, rgba(175,204,198,.35), transparent 28rem),
      linear-gradient(180deg, #fbfdfc 0%, var(--bg) 46%);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Layout ─────────────────────────────────────────────── */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: rgba(255,255,255,.92);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 100;
    backdrop-filter: blur(16px);
    box-shadow: 10px 0 35px rgba(29,37,48,.04);
  }
  .sidebar-header {
    padding: 24px 20px 18px;
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-dot {
    width: 12px; height: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-soft));
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(175,204,198,.3);
    flex-shrink: 0;
  }
  .logo-text { font-size: 11pt; font-weight: 700; color: var(--brand); letter-spacing: .04em; }
  .logo-sub  { font-size: 8pt; color: var(--muted); margin-top: 1px; }

  .nav { flex: 1; padding: 14px 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 12px;
    border-radius: 11px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 5px;
    transition: background .12s, color .12s, box-shadow .12s, transform .12s;
    border: none; background: none; width: 100%; text-align: left; font-size: 10.5pt;
  }
  .nav-item:hover  { background: var(--brand-bg); color: var(--brand); transform: translateX(1px); }
  .nav-item.active { background: var(--brand-bg); color: var(--brand); font-weight: 700; box-shadow: inset 3px 0 0 var(--brand); }
  .nav-icon { font-size: 14px; width: 18px; text-align: center; }

  .sidebar-footer {
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    font-size: 9pt;
    color: var(--muted);
  }
  .logout-btn {
    background: none; border: none; color: var(--brand);
    font-size: 9pt; font-weight: 600; cursor: pointer; padding: 0;
  }
  .logout-btn:hover { text-decoration: underline; }

  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    padding: 34px 40px 44px;
    width: calc(100% - var(--sidebar-w));
  }

  /* ── Topbar ─────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    margin-bottom: 22px;
  }
  .page-title { font-size: 21pt; font-weight: 800; color: var(--ink); letter-spacing: -.02em; }
  .page-sub   { color: var(--muted); font-size: 10pt; margin-top: 2px; }

  /* ── Filters / Controls ─────────────────────────────────── */
  .controls {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px; flex-wrap: wrap;
    background: rgba(255,255,255,.78);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    box-shadow: var(--shadow-sm);
  }
  .controls-customers {
    align-items: flex-end;
    gap: 12px;
    flex-wrap: nowrap;
  }
  .controls-customers #qInput {
    min-width: 702px; /* ~10% narrower than 780px */
    width: min(61.2vw, 882px); /* ~10% narrower than min(68vw, 980px) */
  }
  .controls-customers .field {
    margin-bottom: 0;
  }
  .controls-customers .field label {
    margin-bottom: 4px;
  }
  .controls-customers .btn,
  .controls-customers .btn-ghost {
    min-width: 92px;
    height: 38px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  select, input[type="text"], input[type="date"], textarea {
    padding: 9px 11px;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font-size: 10pt;
    color: var(--ink);
    background: var(--white);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--brand-soft); box-shadow: 0 0 0 3px rgba(175,204,198,.24); }
  .btn {
    padding: 9px 16px;
    background: var(--brand);
    color: #fff;
    font-size: 10pt;
    font-weight: 600;
    border: none; border-radius: 9px; cursor: pointer;
    transition: background .12s, transform .12s, box-shadow .12s;
    box-shadow: 0 8px 18px rgba(47,107,98,.18);
  }
  .btn:hover   { background: #245950; transform: translateY(-1px); }
  .btn-ghost {
    padding: 8px 14px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font-size: 10pt; font-weight: 500;
    color: var(--ink); cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn-ghost:hover { background: var(--brand-bg); border-color: var(--brand-soft); color: var(--brand); }
  .btn-excel-download.btn-ghost:hover {
    background: #245950;
    border-color: #245950;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(36, 89, 80, .28);
  }
  .btn-sm { padding: 5px 11px; font-size: 9.5pt; }
  .link-pill {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 12px; border-radius: 999px;
    background: var(--brand-bg); color: var(--brand); font-weight: 700;
    font-size: 9.5pt;
  }
  .link-pill:hover { text-decoration: none; background: #e2f0ed; }

  /* ── Table ──────────────────────────────────────────────── */
  .table-wrap { background: var(--white); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 13px 16px; text-align: left; vertical-align: middle; }
  th {
    background: var(--brand-bg);
    color: var(--brand);
    font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 1px solid var(--line);
  }
  td { border-bottom: 1px solid var(--line); font-size: 10pt; }
  tr:last-child td { border-bottom: none; }
  tr.clickable:hover td { background: #f4f9f8; cursor: pointer; }
  .td-muted { color: var(--muted); font-size: 9.5pt; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 9pt;
    color: var(--muted);
    word-break: break-all;
  }
  .entity-cell { display: flex; align-items: center; gap: 11px; min-width: 190px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand-bg), #d8ebe7);
    color: var(--brand); font-weight: 800; flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .entity-main { font-weight: 750; color: var(--ink); }
  .entity-sub { color: var(--muted); font-size: 9.2pt; margin-top: 1px; word-break: break-all; }

  /* ── Status badge ───────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 4px 10px; border-radius: 999px;
    font-size: 8.5pt; font-weight: 700;
    letter-spacing: .04em; text-transform: capitalize;
  }
  .badge-new        { background: #e8f0fb; color: var(--status-new); }
  .badge-contacted  { background: #fdf2dd; color: var(--status-contacted); }
  .badge-booked     { background: var(--brand-bg); color: var(--status-booked); }
  .badge-completed  { background: #e8f5ee; color: var(--status-completed); }
  .badge-cancelled  { background: #f1f3f5; color: var(--status-cancelled); }

  /* ── Cards ──────────────────────────────────────────────── */
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card h3 { font-size: 12pt; font-weight: 700; color: var(--ink); margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .field label { font-size: 8.5pt; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 3px; }
  .field .val  { font-size: 10.5pt; color: var(--ink); word-break: break-word; }
  .detail-hero {
    background: linear-gradient(135deg, var(--brand), #234f49);
    color: #fff;
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .detail-hero .page-title, .detail-hero .page-sub { color: #fff; }
  .detail-hero .page-sub { opacity: .82; }
  .detail-hero .badge { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .profile-hero { display: flex; align-items: center; gap: 14px; }
  .profile-hero .avatar { width: 52px; height: 52px; font-size: 15pt; background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.25); }

  /* ── Notes ──────────────────────────────────────────────── */
  .note-item {
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; background: var(--bg);
  }
  .note-item .note-meta { font-size: 8.5pt; color: var(--muted); margin-bottom: 4px; }
  .note-item .note-text { font-size: 10pt; }
  .add-note-form { display: flex; gap: 8px; margin-top: 10px; }
  .add-note-form textarea { flex: 1; resize: vertical; min-height: 60px; }

  /* ── Photos ─────────────────────────────────────────────── */
  .photo-grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .photo-thumb {
    width: 112px; height: 112px; object-fit: cover;
    border-radius: 12px; border: 1px solid var(--line);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .12s, box-shadow .12s;
  }
  .photo-thumb:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

  /* ── Pagination ─────────────────────────────────────────── */
  .pagination { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .page-info  { color: var(--muted); font-size: 9.5pt; }

  /* ── Empty / Loading / Error ────────────────────────────── */
  .empty { padding: 44px; text-align: center; color: var(--muted); }
  .loading { padding: 70px 40px; text-align: center; color: var(--muted); }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-box {
    background: #fdf0ef; border: 1px solid #f5c6c2; color: #c0392b;
    border-radius: 12px; padding: 13px 15px; margin-bottom: 14px; font-size: 10pt;
  }

  /* ── Back link ──────────────────────────────────────────── */
  .back-link { font-size: 10pt; color: var(--brand); cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .back-link:hover { text-decoration: underline; }

  #content { min-height: 200px; }

  @media (max-width: 900px) {
    :root { --sidebar-w: 100%; }
    .layout { display: block; }
    .sidebar { position: relative; width: 100%; height: auto; bottom: auto; }
    .nav { display: flex; gap: 8px; }
    .nav-item { justify-content: center; }
    .sidebar-footer { display: none; }
    .main { margin-left: 0; width: 100%; padding: 22px 16px 32px; }
    .topbar, .detail-hero { align-items: flex-start; flex-direction: column; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .table-wrap { overflow-x: auto; }
    table { min-width: 760px; }
  }
</style>
</head>
<body>

<div class="layout">
  <!-- ── Sidebar ── -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-dot"></span>
        <div>
          <div class="logo-text">INFLATE STUDIO</div>
          <div class="logo-sub">CRM</div>
        </div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-item active" id="nav-consultations" onclick="navigate('consultations')">
        <span class="nav-icon">📋</span> Consultations
      </button>
      <button class="nav-item" id="nav-customers" onclick="navigate('customers')">
        <span class="nav-icon">👥</span> Customers
      </button>
    </div>
    <div class="sidebar-footer">
      <div id="adminEmailDisplay" style="margin-bottom:6px;"></div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <!-- ── Main ── -->
  <main class="main">
    <div id="content"><div class="loading"><span class="spinner"></span>Loading…</div></div>
  </main>
</div>

<script>
// ════════════════════════════════════════════════════════
//  State & Auth
// ════════════════════════════════════════════════════════
const TOKEN = localStorage.getItem('adminToken');
const EMAIL = localStorage.getItem('adminEmail') || '';

// Admin API lives under /api/crm in the unified backend. Existing call sites
// pass paths like "/admin/customers" — we prefix them here in one place.
const API_BASE = '/api/crm';

if (!TOKEN) {
  window.location.replace('/admin/login.html');
}

document.getElementById('adminEmailDisplay').textContent = EMAIL;

const api = async (path, opts = {}) => {
  const url = path.startsWith('http') ? path : `${API_BASE}${path}`;
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${TOKEN}`,
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.removeItem('adminToken');
    window.location.replace('/admin/login.html');
    return null;
  }
  return res.json();
};

const downloadAdminCsv = async (path, fallbackName) => {
  const url = path.startsWith('http') ? path : `${API_BASE}${path}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${TOKEN}` } });
  if (res.status === 401) {
    localStorage.removeItem('adminToken');
    window.location.replace('/admin/login.html');
    return;
  }
  if (!res.ok) {
    alert(`Download failed (${res.status})`);
    return;
  }
  const cd = res.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="([^"]+)"/);
  const filename = m ? m[1] : fallbackName;
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
};

window.downloadConsultationsExport = () => {
  const params = new URLSearchParams();
  if (cStatus) params.set('status', cStatus);
  if (cFrom) params.set('from', cFrom);
  if (cTo) params.set('to', cTo);
  const q = params.toString();
  downloadAdminCsv(`/admin/consultations/export${q ? `?${q}` : ''}`, 'consultations-export.csv');
};

window.downloadCustomersExport = () => {
  const params = new URLSearchParams();
  if (custQ) params.set('q', custQ);
  if (custMemberFrom) params.set('memberSinceFrom', custMemberFrom);
  if (custMemberTo) params.set('memberSinceTo', custMemberTo);
  const q = params.toString();
  downloadAdminCsv(`/admin/customers/export${q ? `?${q}` : ''}`, 'customers-export.csv');
};

const logout = () => {
  localStorage.clear();
  window.location.replace('/admin/login.html');
};

// ════════════════════════════════════════════════════════
//  Router
// ════════════════════════════════════════════════════════
const content = document.getElementById('content');

const setContent = (html) => { content.innerHTML = html; };
const loading    = ()     => setContent('<div class="loading"><span class="spinner"></span>Loading…</div>');

const setActiveNav = (section) => {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`nav-${section}`);
  if (el) el.classList.add('active');
};

function navigate(section, ...args) {
  const encodedArgs = args.map((arg) => encodeURIComponent(String(arg)));
  const hash = encodedArgs.length ? `#/${section}/${encodedArgs.join('/')}` : `#/${section}`;
  window.location.hash = hash;
}

const ROUTES = [
  [/^#\/consultations\/([^/]+)$/,   (_, id) => renderConsultationDetail(decodeURIComponent(id))],
  [/^#\/consultations$/,             ()      => renderConsultationsList()],
  [/^#\/customers\/(.+)$/,          (_, id) => renderCustomerDetail(decodeURIComponent(id))],
  [/^#\/customers$/,                 ()      => renderCustomersList()],
];

const router = () => {
  const hash = window.location.hash || '#/consultations';
  for (const [re, handler] of ROUTES) {
    const m = hash.match(re);
    if (m) { handler(...m); return; }
  }
  renderConsultationsList();
};

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

// ════════════════════════════════════════════════════════
//  Helpers
// ════════════════════════════════════════════════════════
const fmt = {
  date: (d) => d ? new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '—',
  datetime: (d) => d ? new Date(d).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—',
  type: (t) => ({ phone:'Phone', virtual:'Virtual', in_person:'In-Person' }[t] || t || '—'),
  usd: (n) => n != null ? `$${n}` : '—',
  dur: (n) => n ? `${n} min` : '—',
};

const badge = (status) =>
  `<span class="badge badge-${escHtml(status)}">${escHtml(status)}</span>`;

const errBox = (msg) => `<div class="err-box">${msg}</div>`;

const displayName = (item = {}) =>
  escHtml(
    item.fullName ||
    `${item.firstName || ''} ${item.lastName || ''}`.trim() ||
    item.email ||
    item.shopifyCustomerId ||
    'Customer'
  );

const initials = (item = {}) => {
  const source = (
    item.fullName ||
    `${item.firstName || ''} ${item.lastName || ''}`.trim() ||
    item.email ||
    'C'
  ).trim();
  const parts = source.split(/\s+/).filter(Boolean);
  return escHtml(((parts[0]?.[0] || 'C') + (parts[1]?.[0] || '')).toUpperCase());
};

const customerCell = (item = {}, sub = '') => `
  <div class="entity-cell">
    <span class="avatar">${initials(item)}</span>
    <div>
      <div class="entity-main">${displayName(item)}</div>
      <div class="entity-sub">${escHtml(sub || item.email || item.shopifyCustomerId || '')}</div>
    </div>
  </div>
`;

const tagBadges = (tags = []) =>
  tags.map(t => `<span class="badge badge-booked">${escHtml(t)}</span>`).join(' ') || '—';

// ════════════════════════════════════════════════════════
//  Consultations List
// ════════════════════════════════════════════════════════
let cPage = 1, cStatus = '', cFrom = '', cTo = '';

async function renderConsultationsList(page = 1) {
  setActiveNav('consultations');
  cPage = page;
  loading();

  const params = new URLSearchParams({ page, limit: 20 });
  if (cStatus) params.set('status', cStatus);
  if (cFrom)   params.set('from', cFrom);
  if (cTo)     params.set('to', cTo);

  const json = await api(`/admin/consultations?${params}`);
  if (!json) return;

  const { data = [], pagination = {} } = json;

  const rows = data.length
    ? data.map(c => `
        <tr class="clickable" onclick="navigate('consultations','${c._id}')">
          <td>${customerCell(c, c.email || c.shopifyCustomerId)}</td>
          <td>${badge(c.status)}</td>
          <td>${fmt.type(c.type)}</td>
          <td><b>${fmt.date(c.scheduledDate)}</b><div class="td-muted">${c.scheduledTime || 'No time set'}</div></td>
          <td>${c.shopifyOrderName || c.shopifyOrderId || '—'}</td>
          <td>${fmt.usd(c.price)}</td>
          <td>${fmt.date(c.createdAt)}</td>
        </tr>`).join('')
    : `<tr><td colspan="7"><div class="empty">No consultations found.</div></td></tr>`;

  const pag = pagination.pages > 1 ? `
    <div class="pagination">
      <button class="btn-ghost btn-sm" onclick="renderConsultationsList(${page-1})" ${page<=1?'disabled':''}>← Prev</button>
      <span class="page-info">Page ${page} of ${pagination.pages} &nbsp;·&nbsp; ${pagination.total} total</span>
      <button class="btn-ghost btn-sm" onclick="renderConsultationsList(${page+1})" ${page>=pagination.pages?'disabled':''}>Next →</button>
    </div>` : '';

  setContent(`
    <div class="topbar">
      <div><div class="page-title">Consultations</div><div class="page-sub">${pagination.total ?? 0} total records</div></div>
      <button type="button" class="btn-ghost btn-excel-download" onclick="downloadConsultationsExport()" title="CSV file opens in Microsoft Excel">Download Excel</button>
    </div>
    <div class="controls">
      <select id="fStatus" onchange="cStatus=this.value;renderConsultationsList(1)">
        <option value="">All statuses</option>
        <option value="new" ${cStatus==='new'?'selected':''}>New</option>
        <option value="contacted" ${cStatus==='contacted'?'selected':''}>Contacted</option>
        <option value="booked" ${cStatus==='booked'?'selected':''}>Booked</option>
        <option value="completed" ${cStatus==='completed'?'selected':''}>Completed</option>
        <option value="cancelled" ${cStatus==='cancelled'?'selected':''}>Cancelled</option>
      </select>
      <input type="date" id="fFrom" value="${cFrom}" placeholder="From" onchange="cFrom=this.value;renderConsultationsList(1)" />
      <input type="date" id="fTo"   value="${cTo}"   placeholder="To"   onchange="cTo=this.value;renderConsultationsList(1)" />
      <button class="btn-ghost btn-sm" onclick="cStatus='';cFrom='';cTo='';renderConsultationsList(1)">Clear</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Customer</th><th>Status</th><th>Type</th><th>Scheduled</th><th>Order</th><th>Price</th><th>Created</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pag}
  `);
}

// ════════════════════════════════════════════════════════

async function renderConsultationDetail(id) {

          <div class="field"><label>Consultation Date</label><div class="val">${fmt.date(c.scheduledDate)}</div></div>

          <div class="field"><label>Duration</label><div class="val">${fmt.dur(c.duration)}</div></div>
          <div class="field"><label>Fee</label><div class="val">${fmt.usd(c.price)}</div></div>

      <!-- Shopify -->

          <div class="field"><label>Customer ID</label><div class="val mono">${c.shopifyCustomerId || '—'}</div></div>
          <div class="field"><label>Order ID</label><div class="val mono">${c.shopifyOrderId || '—'}</div></div>
          <div class="field"><label>Order #</label><div class="val">${c.shopifyOrderName || '—'}</div></div>

window.saveConsultationUpdate = async (id) => {
  const status = document.getElementById('statusSel').value;
  const note   = document.getElementById('noteInput').value.trim();
  const body   = {};
  if (status) body.status = status;
  if (note)   body.note   = note;

  const json = await api(`/admin/consultations/${id}`, {
    method: 'PATCH',
    body:   JSON.stringify(body),
  });
  if (!json || json.statusCode >= 400) {
    alert(json?.message || 'Save failed');
    return;
  }
  const msg = document.getElementById('saveMsg');
  msg.style.display = 'inline';
  if (note) document.getElementById('noteInput').value = '';
  setTimeout(() => { msg.style.display = 'none'; }, 3000);
  // Refresh notes list
  if (note && json.data?.internalNotes) {
    document.getElementById('notesList').innerHTML =
      json.data.internalNotes.map(n => `
        <div class="note-item">
          <div class="note-meta">${n.addedBy} · ${fmt.datetime(n.addedAt)}</div>
          <div class="note-text">${escHtml(n.text)}</div>
        </div>`).join('');
  }
};

// ════════════════════════════════════════════════════════
//  Customers List
// ════════════════════════════════════════════════════════
let custPage = 1, custQ = '', custMemberFrom = '', custMemberTo = '';
let customerSearchTimer = null;

window.handleCustomerSearchInput = (value) => {
  const next = (value || '').trim();
  if (next === custQ) return;
  if (customerSearchTimer) clearTimeout(customerSearchTimer);
  customerSearchTimer = setTimeout(() => {
    custQ = next;
    renderCustomersList(1, { showLoading: false, preserveSearchFocus: true });
  }, 180);
};

async function renderCustomersList(page = 1, opts = {}) {
  const { showLoading = true, preserveSearchFocus = false } = opts;
  setActiveNav('customers');
  custPage = page;
  if (showLoading) loading();

  const params = new URLSearchParams({ page, limit: 20 });
  if (custQ) params.set('q', custQ);
  if (custMemberFrom) params.set('memberSinceFrom', custMemberFrom);
  if (custMemberTo) params.set('memberSinceTo', custMemberTo);

  const json = await api(`/admin/customers?${params}`);
  if (!json) return;

  const { data = [], pagination = {} } = json;

  const rows = data.length
    ? data.map(c => `
        <tr class="clickable" onclick="navigate('customers','${c._id}')">
          <td>${customerCell(c, c.shopifyCustomerId)}</td>
          <td>${escHtml(c.email || '—')}</td>
          <td>${c.phone || '—'}</td>
          <td>${fmt.date(c.memberSince)}</td>
          <td>${tagBadges(c.tags || [])}</td>
        </tr>`).join('')
    : `<tr><td colspan="5"><div class="empty">No customers found.</div></td></tr>`;

  const pag = pagination.pages > 1 ? `
    <div class="pagination">
      <button class="btn-ghost btn-sm" onclick="renderCustomersList(${page-1})" ${page<=1?'disabled':''}>← Prev</button>
      <span class="page-info">Page ${page} of ${pagination.pages} &nbsp;·&nbsp; ${pagination.total} total</span>
      <button class="btn-ghost btn-sm" onclick="renderCustomersList(${page+1})" ${page>=pagination.pages?'disabled':''}>Next →</button>
    </div>` : '';

  setContent(`
    <div class="topbar">
      <div><div class="page-title">Customers</div><div class="page-sub">${pagination.total ?? 0} CRM profiles</div></div>
      <button type="button" class="btn-ghost btn-excel-download" onclick="downloadCustomersExport()" title="CSV file opens in Microsoft Excel">Download Excel</button>
    </div>
    <div class="controls controls-customers">
      <input type="text" id="qInput" value="${escHtml(custQ)}" placeholder="Search by name, email, phone, or Shopify ID…"
             oninput="handleCustomerSearchInput(this.value)"
             onkeydown="if(event.key==='Enter'){custQ=this.value.trim();renderCustomersList(1)}" />
      <div class="field" style="min-width:120px;">
        <label>From</label>
        <input type="date" id="memberFromInput" value="${escHtml(custMemberFrom)}" onchange="custMemberFrom=this.value;renderCustomersList(1)" title="Joined After (inclusive)" />
      </div>
      <div class="field" style="min-width:120px;">
        <label>To</label>
        <input type="date" id="memberToInput" value="${escHtml(custMemberTo)}" onchange="custMemberTo=this.value;renderCustomersList(1)" title="Joined Before (inclusive)" />
      </div>
      <button class="btn" onclick="custQ=document.getElementById('qInput').value.trim();renderCustomersList(1)">Search</button>
      <button class="btn-ghost" onclick="custQ='';custMemberFrom='';custMemberTo='';document.getElementById('qInput').value='';renderCustomersList(1)">Clear</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Member Since</th><th>Tags</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${pag}
  `);

  if (preserveSearchFocus) {
    const qInput = document.getElementById('qInput');
    if (qInput) {
      qInput.focus();
      const len = qInput.value.length;
      qInput.setSelectionRange(len, len);
    }
  }
}

// ════════════════════════════════════════════════════════
//  Customer Detail
// ════════════════════════════════════════════════════════
async function renderCustomerDetail(id) {
  setActiveNav('customers');
  loading();

  // Shopify GIDs contain "/" (e.g. gid://shopify/Customer/123). Must encode as a
  // single path segment or Express only sees "gid:" and the request never matches.
  const encodedId = encodeURIComponent(id);
  let json;
  try {
    json = await api(`/admin/customers/${encodedId}`);
  } catch (e) {
    setContent(errBox(e?.message || 'Request failed'));
    return;
  }
  if (!json) return;
  if (json.statusCode >= 400) { setContent(errBox(json.message)); return; }

  const c     = json.data;
  const cons  = c.consultations || [];

  const notesHtml = (c.notes || []).length
    ? c.notes.map(n => `
        <div class="note-item">
          <div class="note-meta">${n.addedBy} · ${fmt.datetime(n.addedAt)}</div>
          <div class="note-text">${escHtml(n.text)}</div>
        </div>`).join('')
    : '<p style="color:var(--muted);font-size:10pt;">No notes yet.</p>';

  const consRows = cons.length
    ? cons.map(c => `
        <tr class="clickable" onclick="navigate('consultations','${c._id}')">
          <td>${fmt.type(c.type)}</td>
          <td>${badge(c.status)}</td>
          <td>${fmt.date(c.scheduledDate)}</td>
          <td>${c.intake?.eventType || '—'}</td>
          <td>${fmt.usd(c.price)}</td>
          <td>${fmt.date(c.createdAt)}</td>
        </tr>`).join('')
    : `<tr><td colspan="6"><div class="empty">No consultations on file.</div></td></tr>`;

  setContent(`
    <span class="back-link" onclick="navigate('customers')">← All customers</span>
    <div class="topbar detail-hero">
      <div class="profile-hero">
        <span class="avatar">${initials(c)}</span>
        <div>
          <div class="page-title">${displayName(c)}</div>
          <div class="page-sub">Shopify ID: ${c.shopifyCustomerId}</div>
        </div>
      </div>
    </div>

    <!-- Profile info -->
    <div class="card">
      <h3>Profile</h3>
      <div class="grid-3">
        <div class="field"><label>First Name</label><div class="val">${c.firstName || '—'}</div></div>
        <div class="field"><label>Last Name</label><div class="val">${c.lastName || '—'}</div></div>
        <div class="field"><label>Email</label><div class="val">${c.email || '—'}</div></div>
        <div class="field"><label>Phone</label><div class="val">${c.phone || '—'}</div></div>
        <div class="field"><label>Member Since</label><div class="val">${fmt.date(c.memberSince)}</div></div>
        <div class="field"><label>Tags</label><div class="val">${tagBadges(c.tags || [])}</div></div>
      </div>
    </div>

    <!-- Edit tags + add note -->
    <div class="card">
      <h3>Actions</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:200px;">
          <label style="font-size:9pt;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px;">Tags (comma-separated)</label>
          <input type="text" id="tagsInput" value="${(c.tags||[]).join(', ')}" placeholder="VIP, returning, event-client…" style="width:100%;" />
        </div>
        <div style="flex:1;min-width:200px;">
          <label style="font-size:9pt;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px;">Add internal note</label>
          <input type="text" id="custNoteInput" placeholder="Note…" style="width:100%;" />
        </div>
        <button class="btn" onclick="saveCustomerUpdate('${c._id}')">Save</button>
        <span id="custSaveMsg" style="font-size:9.5pt;color:var(--status-completed);display:none;">✓ Saved</span>
      </div>
    </div>

    <!-- Customer notes -->
    <div class="card">
      <h3>Internal Notes</h3>
      <div id="custNotesList">${notesHtml}</div>
    </div>

    <!-- Consultation history -->
    <div class="card">
      <h3>Consultation History (${cons.length})</h3>
      <div class="table-wrap" style="margin:0;">
        <table>
          <thead><tr><th>Type</th><th>Status</th><th>Scheduled</th><th>Event Type</th><th>Price</th><th>Created</th></tr></thead>
          <tbody>${consRows}</tbody>
        </table>
      </div>
    </div>
  `);
}

window.saveCustomerUpdate = async (id) => {
  const tagsRaw = document.getElementById('tagsInput').value.trim();
  const note    = document.getElementById('custNoteInput').value.trim();
  const body    = {};

  if (tagsRaw !== undefined) {
    body.tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  }
  if (note) body.note = note;

  const json = await api(`/admin/customers/${id}`, {
    method: 'PATCH',
    body:   JSON.stringify(body),
  });
  if (!json || json.statusCode >= 400) {
    alert(json?.message || 'Save failed');
    return;
  }
  const msg = document.getElementById('custSaveMsg');
  msg.style.display = 'inline';
  if (note) document.getElementById('custNoteInput').value = '';
  setTimeout(() => { msg.style.display = 'none'; }, 3000);

  if (note && json.data?.notes) {
    document.getElementById('custNotesList').innerHTML =
      json.data.notes.map(n => `
        <div class="note-item">
          <div class="note-meta">${n.addedBy} · ${fmt.datetime(n.addedAt)}</div>
          <div class="note-text">${escHtml(n.text)}</div>
        </div>`).join('');
  }
};

// ════════════════════════════════════════════════════════
//  Utilities
// ════════════════════════════════════════════════════════
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
